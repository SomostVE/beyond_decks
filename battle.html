<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Battle Sim · Beyond Decks</title>
  <link rel="stylesheet" href="./css/base.css?v=01.05.025">
  <link rel="stylesheet" href="./css/tools.css?v=01.05.025">
  <link rel="stylesheet" href="./css/tool-header.css?v=01.05.025">
  <link rel="stylesheet" href="./css/battle.css?v=01.05.025">
  <link rel="stylesheet" href="./css/battle-benchmark.css?v=01.05.025">
  <link rel="stylesheet" href="./css/modern-tools.css?v=01.05.025">
  <link rel="stylesheet" href="./css/readability-fixes.css?v=01.05.025">
</head>
<body class="tools-body battle-body">
  <header class="tools-header battle-header">
    <a class="button" href="./index.html">← Cards</a>
    <a class="button" href="./collection.html">Collection</a>
    <span class="tools-title">Battle Sim</span>
  </header>

  <main class="tools-page battle-page">
    <section class="tools-panel battle-setup">
      <div class="battle-title-row"><div><h1>Battle Sim</h1></div></div>

      <div class="battle-setup-grid">
        <label><span>Your deck</span><select id="battle-your-deck"></select></label>
        <label>
          <span>Your play profile</span>
          <select id="battle-player-strategy">
            <option value="auto">Auto detect</option>
            <option value="aggro">Aggro</option>
            <option value="midrange">Midrange</option>
            <option value="control">Control</option>
            <option value="ramp">Ramp</option>
            <option value="spell-combo">Spell / Combo</option>
            <option value="buff-tempo">Buff / Tempo</option>
            <option value="puppetry-tempo">Puppetry / Tempo</option>
            <option value="ward-control">Ward / Control</option>
          </select>
        </label>
        <label><span>Reference opponent</span><select id="battle-opponent"></select></label>
        <label>
          <span>Your side</span>
          <select id="battle-side">
            <option value="random">Random</option>
            <option value="first">First</option>
            <option value="second">Second</option>
          </select>
        </label>
        <label class="battle-seed-field">
          <span>Seed</span>
          <div><input id="battle-seed" type="text" spellcheck="false"><button id="battle-new-seed" class="button" type="button">New</button></div>
        </label>
      </div>

      <div id="battle-opponent-meta" class="battle-opponent-meta"></div>
      <div id="battle-coverage" class="battle-coverage"></div>
      <div id="battle-status" class="battle-status" data-type="info"></div>
      <div class="tools-actions"><button id="battle-start" class="button battle-start" type="button">Simulate game</button></div>
    </section>

    <section class="tools-panel battle-benchmark">
      <div class="benchmark-head"><div><h2>Benchmark</h2></div></div>
      <div class="benchmark-controls">
        <label>
          <span>Opponent pool</span>
          <select id="benchmark-scope">
            <option value="selected">Selected opponent</option>
            <option value="all">All 7 reference decks</option>
          </select>
        </label>
        <label>
          <span>Games / matchup</span>
          <select id="benchmark-games">
            <option value="25">25 · quick</option>
            <option value="50">50</option>
            <option value="100" selected>100</option>
          </select>
        </label>
        <label>
          <span>Compare deck</span>
          <select id="benchmark-compare"><option value="">Off</option></select>
        </label>
        <button id="benchmark-run" class="button" type="button">Run benchmark</button>
        <button id="benchmark-cancel" class="button" type="button" hidden>Cancel</button>
      </div>

      <div id="benchmark-status" class="battle-status" data-type="info"></div>
      <div class="benchmark-progress-row">
        <progress id="benchmark-progress" value="0" max="100" hidden></progress>
        <span id="benchmark-progress-label"></span>
      </div>
      <div id="benchmark-results"></div>
    </section>

    <section id="battle-replay" class="tools-panel battle-replay" hidden>
      <div class="battle-replay-head">
        <div><h2>Replay</h2></div>
        <div class="battle-replay-controls">
          <button id="battle-prev" class="button" type="button">◀ Prev</button>
          <button id="battle-auto" class="button" type="button">Auto</button>
          <button id="battle-next" class="button" type="button">Next ▶</button>
          <strong id="battle-frame-label"></strong>
        </div>
      </div>
      <div id="battle-summary" class="battle-summary"></div>
      <div id="battle-timeline" class="battle-timeline" aria-label="Replay timeline"></div>
      <div id="battle-action" class="battle-action"></div>
      <div class="battle-table">
        <section id="battle-opponent-area" class="battle-side-area opponent"></section>
        <div class="battle-center-line"><span>VS</span></div>
        <section id="battle-player-area" class="battle-side-area player"></section>
      </div>
    </section>
  </main>

  <script type="module" src="./js/version-guard.js?v=01.05.025"></script>
  <script type="module" src="./js/battle.js?v=01.05.025"></script>
  <script type="module" src="./js/battle-decision-summary.js?v=01.05.025"></script>
  <script type="module" src="./js/battle-benchmark-fast.js?v=01.05.025"></script>
</body>
</html>
