name: Validate site

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Check JavaScript syntax
        run: |
          for file in js/*.js scripts/*.mjs; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Sync Beyond Codex test snapshot
        run: node scripts/sync-beyond-codex.mjs

      - name: Check JSON
        run: |
          node -e "const fs=require('fs');for(const file of ['data/official/cards.json','data/official/metadata.json','data/official/changelog.json','data/official/manifest.json','data/custom/reference-decks.json','data/custom/reference-decks.source.json','data/custom/packages.json','data/custom/tags.json','data/custom/exclusions.json']){JSON.parse(fs.readFileSync(file,'utf8'));console.log('OK '+file)}"

      - name: Run Beyond Codex migration regression
        run: node scripts/check-beyond-codex-migration.mjs

      - name: Run Collection UI structure regression
        run: node scripts/check-collection-ui-structure.mjs

      - name: Run Replay Inspector and mobile navigation regression
        run: node scripts/check-replay-inspector-ui.mjs

      - name: Run Battle Sim exact-rule regressions
        run: node scripts/check-battle-rules.mjs

      - name: Audit all Beyond Codex Crest cards
        run: node scripts/audit-battle-crests.mjs

      - name: Run Battle Sim Crest lifecycle regression
        run: node scripts/check-battle-crests.mjs

      - name: Run Battle Sim class mechanic boundary regression
        run: node scripts/check-battle-class-mechanics.mjs

      - name: Run Battle Sim exclusive class contracts
        run: node scripts/check-battle-class-contracts.mjs

      - name: Run Battle Sim reactive-event regressions
        run: node scripts/check-battle-reactive-events.mjs

      - name: Run Battle Sim Artifact history regressions
        run: node scripts/check-battle-artifact-history.mjs

      - name: Run Battle Sim focus deck regressions
        run: node scripts/check-battle-focus-rules.mjs

      - name: Run Battle Sim ability evolution regression
        run: node scripts/check-battle-ability-evolve.mjs

      - name: Run Battle Sim Asher regression
        run: node scripts/check-battle-asher.mjs

      - name: Run Battle Sim tactical look-ahead regression
        run: node scripts/check-battle-ai-lookahead.mjs

      - name: Run Battle Sim Fuse regression
        run: node scripts/check-battle-fuse.mjs

      - name: Run Battle Sim target branching regression
        run: node scripts/check-battle-target-branching.mjs

      - name: Run Battle Sim full-turn planner regression
        run: node scripts/check-battle-turn-planner.mjs

      - name: Run Battle Sim two-turn look-ahead regression
        run: node scripts/check-battle-two-turn-lookahead.mjs

      - name: Audit Battle Sim AI behavior baseline
        run: node scripts/audit-battle-ai-behavior.mjs

      - name: Run Battle Sim integrity audit
        run: node scripts/check-battle-integrity.mjs

      - name: Run Battle Sim full coverage regression
        run: node scripts/check-battle-coverage-100.mjs

      - name: Run Runecraft class regression
        run: node scripts/check-battle-runecraft-full.mjs

      - name: Run Swordcraft class regression
        run: node scripts/check-battle-swordcraft-full.mjs

      - name: Run Forestcraft class regression
        run: node scripts/check-battle-forestcraft-full.mjs

      - name: Run Dragoncraft class regression
        run: node scripts/check-battle-dragoncraft-full.mjs

      - name: Run Abysscraft class regression
        run: node scripts/check-battle-abysscraft-full.mjs

      - name: Run Havencraft class regression
        run: node scripts/check-battle-havencraft-full.mjs

      - name: Run Portalcraft class regression
        run: node scripts/check-battle-portalcraft-full.mjs

      - name: Run Neutral class regression
        run: node scripts/check-battle-neutral-full.mjs

      - name: Run strict all-card Battle Sim audit
        run: node scripts/audit-battle-final.mjs

      - name: Inventory Battle Sim high-risk cards
        run: node scripts/audit-battle-high-risk.mjs

      - name: Run Battle Sim high-risk runtime gate
        run: node scripts/audit-battle-high-risk-runtime.mjs

      - name: Run Battle Sim v5 integration
        run: node scripts/check-battle-v5-integration.mjs

      - name: Run Battle Sim smoke test
        run: node scripts/check-battle-sim.mjs

      - name: Run Battle Sim benchmark smoke test
        run: node scripts/check-battle-benchmark.mjs

      - name: Run Battle Sim benchmark calibration
        run: node scripts/check-battle-benchmark-calibration.mjs

      - name: Run paired benchmark comparison smoke test
        run: node scripts/check-battle-benchmark-compare.mjs

      - name: Run Battle Sim share-ready release gate
        run: node scripts/check-battle-share-ready.mjs
