name: Temporary V5 Refactor Boundary Inspection

on:
  push:
    branches:
      - refactor/battle-engine-v5-01.05.018
    paths:
      - .github/workflows/inspect-v5-refactor-boundaries.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/battle-engine-v5-01.05.018
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect V5 boundaries
        run: node scripts/inspect-v5-refactor-boundaries.mjs
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .v5-refactor-boundaries.txt
          git commit -m "chore: record temporary V5 refactor boundaries"
          git push
