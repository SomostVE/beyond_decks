name: Temporary V5 Function Map

on:
  push:
    branches:
      - refactor/battle-engine-v5-01.05.022
    paths:
      - .github/workflows/inspect-v5-function-map.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/battle-engine-v5-01.05.022
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build function map
        run: node scripts/inspect-v5-function-map.mjs
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .v5-function-map.txt
          git commit -m "chore: record temporary V5 function map"
          git push
