name: Temporary V5 Planner Dependencies

on:
  push:
    branches:
      - refactor/battle-engine-v5-01.05.023
    paths:
      - .github/workflows/inspect-v5-planner-deps.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/battle-engine-v5-01.05.023
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Inspect planner dependencies
        run: node scripts/inspect-v5-planner-deps.mjs
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .v5-planner-deps.txt
          git commit -m "chore: record temporary V5 planner dependencies"
          git push
