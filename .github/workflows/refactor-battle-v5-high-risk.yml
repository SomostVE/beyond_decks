name: Temporary Battle V5 High-Risk Refactor

on:
  push:
    branches:
      - refactor/battle-engine-v5-01.05.024
    paths:
      - .github/workflows/refactor-battle-v5-high-risk.yml

permissions:
  contents: write

jobs:
  extract-high-risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/battle-engine-v5-01.05.024
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Extract high-risk rules
        run: node scripts/refactor-battle-v5-extract-high-risk.mjs
      - name: Syntax check
        run: |
          node --check js/battle-engine-v5.js
          node --check js/battle-engine-v5-high-risk.js
          git diff --check
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/battle-engine-v5.js js/battle-engine-v5-high-risk.js version.json index.html collection.html battle.html
          git commit -m "refactor: extract Battle V5 high-risk rules"
          git push
