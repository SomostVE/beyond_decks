name: Temporary Battle V5 Planner Refactor

on:
  push:
    branches:
      - refactor/battle-engine-v5-01.05.023
    paths:
      - .github/workflows/refactor-battle-v5-planner.yml

permissions:
  contents: write

jobs:
  extract-planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/battle-engine-v5-01.05.023
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Extract planner
        run: node scripts/refactor-battle-v5-extract-planner.mjs
      - name: Syntax check
        run: |
          node --check js/battle-engine-v5.js
          node --check js/battle-engine-v5-planner.js
          git diff --check
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/battle-engine-v5.js js/battle-engine-v5-planner.js version.json index.html collection.html battle.html
          git commit -m "refactor: extract Battle V5 planner"
          git push
