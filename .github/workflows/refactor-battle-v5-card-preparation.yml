name: Temporary Battle V5 Card Preparation Refactor

on:
  push:
    branches:
      - refactor/battle-engine-v5-01.05.014
    paths:
      - .github/workflows/refactor-battle-v5-card-preparation.yml

permissions:
  contents: write

jobs:
  extract-card-preparation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/battle-engine-v5-01.05.014
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Extract card preparation pipeline
        run: node scripts/refactor-battle-v5-extract-card-preparation.mjs
      - name: Syntax check
        run: |
          node --check js/battle-engine-v5.js
          node --check js/battle-engine-v5-card-preparation.js
          git diff --check
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/battle-engine-v5.js js/battle-engine-v5-card-preparation.js version.json index.html collection.html battle.html
          git commit -m "refactor: extract Battle V5 card preparation pipeline"
          git push
